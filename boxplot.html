<script>
//variables
let values = [];
let median_correct, q1_correct, q3_correct, iqr_correct;

//quartiles to match Excel
function percentile_inc(sorted, p) {
  const n = sorted.length;
  const k = (n - 1) * p + 1;
  const f = Math.floor(k);
  const d = k - f;

  if (f <= 0) return sorted[0];
  if (f >= n) return sorted[n - 1];

  return sorted[f - 1] + d * (sorted[f] - sorted[f - 1]);
}

//draw the plot.

function drawBoxplot(min, q1, median, q3, max) {
  const canvas = document.getElementById("boxplot");
  const ctx = canvas.getContext("2d");

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const paddingTop = 20;
  const paddingBottom = 30;
  const paddingLeft = 60;
  const paddingRight = 20;
  const centerX = (canvas.width + paddingLeft + paddingRight) / 2;

  const dataMin = Math.floor(min / 5) * 5;
  const dataMax = Math.ceil(max / 5) * 5;

  const scaleY = (v) =>
    paddingTop +
    (dataMax - v) / (dataMax - dataMin) *
    (canvas.height - paddingTop - paddingBottom);

//draw grids and axes
  ctx.font = "12px sans-serif";
  ctx.textAlign = "right";
  ctx.textBaseline = "middle";

  for (let v = dataMin; v <= dataMax; v += 1) {
    const y = scaleY(v);

    //grids
    ctx.strokeStyle = "#e0e0e0";
    ctx.beginPath();
    ctx.moveTo(paddingLeft, y);
    ctx.lineTo(canvas.width - paddingRight, y);
    ctx.stroke();

    //tick
    ctx.strokeStyle = "#000";
    ctx.beginPath();
    ctx.moveTo(paddingLeft - 5, y);
    ctx.lineTo(paddingLeft, y);
    ctx.stroke();

    //label
    ctx.fillText(v.toString(), paddingLeft - 8, y);
  }

  //axis itself
  ctx.beginPath();
  ctx.moveTo(paddingLeft, paddingTop);
  ctx.lineTo(paddingLeft, canvas.height - paddingBottom);
  ctx.stroke();

  //whiskers
  ctx.beginPath();
  ctx.moveTo(centerX, scaleY(min));
  ctx.lineTo(centerX, scaleY(max));
  ctx.stroke();

  //extremes
  ctx.beginPath();
  ctx.moveTo(centerX - 15, scaleY(min));
  ctx.lineTo(centerX + 15, scaleY(min));
  ctx.moveTo(centerX - 15, scaleY(max));
  ctx.lineTo(centerX + 15, scaleY(max));
  ctx.stroke();

  //box
  ctx.strokeRect(
    centerX - 30,
    scaleY(q3),
    60,
    scaleY(q1) - scaleY(q3)
  );

  //median line
  ctx.beginPath();
  ctx.moveTo(centerX - 30, scaleY(median));
  ctx.lineTo(centerX + 30, scaleY(median));
  ctx.stroke();
}

//generate the data
function generate() {
  values = [];
  for (let i = 0; i < 20; i++) {
    values.push(Math.floor(Math.random() * 20) + 10);
  }

  const sorted = [...values].sort((a, b) => a - b);

  q1_correct = percentile_inc(sorted, 0.25);
  median_correct = percentile_inc(sorted, 0.5);
  q3_correct = percentile_inc(sorted, 0.75);
  iqr_correct = q3_correct - q1_correct;

  drawBoxplot(
    sorted[0],
    q1_correct,
    median_correct,
    q3_correct,
    sorted[sorted.length - 1]
  );

  document.getElementById("median").value = "";
  document.getElementById("iqr").value = "";
  document.getElementById("feedback").textContent = "";
}

//check answers
function check() {
  const m = parseFloat(document.getElementById("median").value);
  const iqr = parseFloat(document.getElementById("iqr").value);

  if (isNaN(m) || isNaN(iqr)) {
    document.getElementById("feedback").textContent =
      "Please enter both values.";
    return;
  }

  const tol = 0.5; // reading-from-graph tolerance

  if (
    Math.abs(m - median_correct) < tol &&
    Math.abs(iqr - iqr_correct) < tol
  ) {
    document.getElementById("feedback").textContent =
      "✔ Correct interpretation.";
  } else {
    document.getElementById("feedback").textContent =
      "✘ Check the position of the median line and box width.";
  }
}

//button reg
function regenerate() {
  generate();
}

//initialise
generate();
</script>
